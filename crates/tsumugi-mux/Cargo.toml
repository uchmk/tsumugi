[package]
name = "tsumugi-mux"
description = "The tsumugi server that keeps sessions alive, and the client a window talks to it with"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }
ito-pane = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f", features = ["serde"] }
ito-layout = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# Pure Rust, with a documented and stable wire format (1.0). bincode was the
# first choice and is unmaintained since 2025 (its 3.0.0 is only a notice);
# QUESTIONS.md Q4.
postcard = { version = "1", default-features = false, features = ["alloc"] }
crossbeam-channel = "0.5"
# settings.toml (QUESTIONS.md Q6): Pure Rust, and what filer reads yazi's
# settings with.
toml = "1.1"
# Editing settings.toml in place -- one key, its comments and layout kept --
# and the clock, both shared with every uchmk app.
ito-common = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

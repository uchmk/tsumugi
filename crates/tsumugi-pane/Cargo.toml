[package]
name = "tsumugi-pane"
description = "A terminal pane: a shell on a PTY (ConPTY on Windows), its key encoding, and an egui view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The pane drawn with egui: `show`, `Palette`, `wheel_whole`.
egui = ["dep:egui", "dep:harfrust", "dep:skrifa", "dep:vello_cpu"]
# Choosing wgpu's backends (`gpu`), through the wgpu that egui draws with.
wgpu = ["dep:egui-wgpu"]
# `Screen` and its cells as serde types, for the tsumugi server to send.
serde = ["dep:serde", "alacritty_terminal/serde"]

[dependencies]
# Default features off: no clipboard or serde from it. The versions are filer's.
alacritty_terminal = { version = "0.26", default-features = false }
crossbeam-channel = "0.5"
polling = "3"
egui = { version = "0.36", optional = true }
egui-wgpu = { version = "0.36", optional = true }
# Ligatures (tsumugi's QUESTIONS.md Q8 and Q10): harfrust shapes a run of
# cells, skrifa reads the outlines of the glyphs it substitutes and vello_cpu
# fills them. The three egui 0.36 draws its own text with, at its versions,
# so nothing new is built; rustybuzz and ab_glyph, used before, are
# unmaintained or carry ttf-parser, which is (RUSTSEC-2026-0206, -0192).
harfrust = { version = "0.12", optional = true }
skrifa = { version = "0.44", default-features = false, features = ["std"], optional = true }
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# A pane's character set other than UTF-8 (Shift_JIS, EUC-JP, ...): what the
# program writes turned into UTF-8 for the parser, and what is typed back
# (tsumugi's QUESTIONS.md Q11, the owner's yes on 2026-10-07). Pure Rust,
# Firefox's, the WHATWG encodings.
encoding_rs = "0.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

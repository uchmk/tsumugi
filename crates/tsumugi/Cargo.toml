[package]
name = "tsumugi"
description = "A terminal for running many AI CLI sessions side by side"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The checklists' generators; their own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[[example]]
name = "make-keycheck"
test = true

[dependencies]
tsumugi-pane = { path = "../tsumugi-pane", features = ["egui", "wgpu"] }
tsumugi-mux = { path = "../tsumugi-mux" }
tsumugi-layout = { path = "../tsumugi-layout" }
eframe = "0.36"
# The status bar's clock in local time; filer uses the same.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = "0.36"
# The window's handle, for the taskbar's number; eframe already builds it.
raw-window-handle = "0.6"
# Theme files (themes/*.toml, theme.toml); already built for the settings.
toml = "1.1"
# The window's material: Mica / Acrylic on Windows 11, vibrancy on macOS
# (QUESTIONS.md Q9). Pure Rust over windows-sys and objc2.
window-vibrancy = "0.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

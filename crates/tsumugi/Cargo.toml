[package]
name = "tsumugi"
description = "A terminal for running many AI CLI sessions side by side"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `tsumugi-com` (src/bin) is the console front for Windows, shipped as
# `tsumugi.com`; plain `cargo run` still means the window.
default-run = "tsumugi"

# The checklists' generators; their own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[[example]]
name = "make-keycheck"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }

[dependencies]
ito-pane = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["egui", "wgpu"] }
tsumugi-mux = { path = "../tsumugi-mux" }
ito-mcp = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
ito-layout = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["egui"] }
# The language uchmk's apps share (common.toml), set from the settings screen.
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["edit"] }
# What every uchmk app shares: common.toml (the theme and the clock too),
# editing a settings file in place, watching it.
ito-common = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["clock", "egui"] }
# The monospace face every uchmk app carries (JetBrains Mono), when no font is chosen.
ito-fonts = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["egui"] }
# The themes, shared with every uchmk app; `pane` for the terminal's colours.
ito-theme = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["pane"] }
# The settings screen, shared with every uchmk app: the nav, the rows and
# their controls, and the pages for common.toml (language, clock, theme).
ito-notify = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
# The key notation of `--keys` scripts (`<C-a>`), the same as kura and yagura.
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa", features = ["egui"] }
# keymap.toml, laid out like kura's and yagura's (yazi's).
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
# F12: the browser opens the bug form with the version and the OS filled in.
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
ito-help = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
# The built-in browser (issue #66, option 2): the OS's own WebView (WebView2,
# WKWebView) as a child of the window. Linux has none; it opens the browser.
ito-browser = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
# `tsumugi.com` (src/bin/tsumugi-com.rs) and the answers `out` and `err`
# write (v0.114.0), shared with every uchmk app; the same commit as the others.
ito-console = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }
# eframe's own defaults, but for `winit/default`: that draws the title on
# Wayland's window frame with ab_glyph, which brings the unmaintained
# ttf-parser (RUSTSEC-2026-0192, QUESTIONS.md Q10). winit below keeps the
# rest of its defaults and the same frame, without the title's text --
# tsumugi draws its own title bar unless told not to.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# The status bar's clock in local time; filer uses the same.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = "0.36"
# The window's handle, for the taskbar's number; eframe already builds it.
raw-window-handle = "0.6"
# Theme files (themes/*.toml, theme.toml); already built for the settings.
toml = "1.1"
# The window's material: Mica / Acrylic on Windows 11, vibrancy on macOS
# (QUESTIONS.md Q9). Pure Rust over windows-sys and objc2.
window-vibrancy = "0.8"
# A screenshot pasted into the input box (QUESTIONS.md Q7, changed by the
# owner on 2026-10-07): the clipboard's image, and PNG to keep it as a file.
# Both already built by eframe (egui-winit's clipboard), at these features.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
global-hotkey = "0.8"

[target."cfg(windows)".dependencies]
windows ={ version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# A serial port's settings (termios), for `tsumugi serial`; already built.
[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
# The generator of TESTING-CHECKS.md (examples/make-testcheck.rs).
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "7804c94a4e5e74bbabcc3c03ce76ee5e4b2cc2aa" }

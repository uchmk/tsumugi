name: Merge lanes

# Merges the real-machine lanes' pull requests (test/win-* and test/arm-*)
# once they keep to the rules in scripts/merge-lanes.py and their checks are
# green, with a merge commit pinned to the head. The merge routine
# (.claude/merge-routine.md) used to merge them; the cloud session's auto mode
# refused such merges in filer (2026-10-10, uchmk/filer#309 and #310), so the
# routine now does only the merger's share and resolves conflicts. The script
# is the same file as filer's; RULES picks this repository's rules.
#
# It runs when a check workflow finishes (a lane's pull request turns green),
# every hour as a fallback, and by hand. It reads pull requests through the
# API and runs only main's copy of the script, never the pull request's code.

on:
  workflow_run:
    workflows: [CI, Checklists, Audit]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would be merged, merge nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: merge-lanes
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Self-test
        run: python3 scripts/merge-lanes.py --self-test
      - name: Merge what may be merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_LANES_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 scripts/merge-lanes.py

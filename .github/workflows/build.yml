name: Build

# A Windows build to download from the Actions tab, so trying tsumugi does not
# need a Rust toolchain: tsumugi.exe with the newer ConPTY beside it
# (scripts/fetch-conpty.ps1). x64 and ARM64, both from the one x64 runner.
# macOS and Linux come later; filer's build.yml has the six-target form.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            arch: x64
          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            arch: arm64
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p tsumugi --target ${{ matrix.target }}
      - name: Gather the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tsumugi.exe dist/
          pwsh -File scripts/fetch-conpty.ps1 -Arch ${{ matrix.arch }} -Dest dist
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tsumugi-${{ matrix.name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*']
  # Merge lanes starts it after its share: its push, made with the
  # workflow's token, starts no workflow by itself
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  test:
    # Windows is the target platform; Linux is cheap and catches the Unix PTY.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs (a server holding a pipe open) fails the job instead
    # of holding the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --all-features
      - run: cargo test --workspace --all-features

  # Linux, Windows and macOS, all from this Linux runner (as verify.sh does):
  # clippy only type-checks and links nothing, so it needs no macOS runner.
  # objc2 compiles a little Objective-C for macOS (its exception helper, which
  # wry turns on), so the macOS clippy goes through cargo-zigbuild, whose zig
  # is a C compiler for macOS. Since 2026-10-16.
  # cargo-zigbuild and its zig come from PyPI, as verify.sh installs them, into
  # a venv (the runner's Python may refuse pip, PEP 668) whose bin goes on
  # PATH, where cargo-zigbuild finds zig as `python3 -m ziglang`.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install -q cargo-zigbuild
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo-zigbuild clippy --workspace --all-targets --all-features --target aarch64-apple-darwin -- -D warnings

  # ARM64, Windows and Linux (v0.94.0): the tests on GitHub's ARM64 runners.
  # On a push to main and by hand, not on a pull request -- the x64 jobs gate
  # those, and this would add its wait to every one.
  arm64:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/arm64.yml

  powershell:
    # The Windows test lane's scripts parse, and its chunk picker picks right.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pwsh -NoProfile -File scripts/check-ps1.ps1

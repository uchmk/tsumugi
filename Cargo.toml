[workspace]
resolver = "2"
members = ["crates/*"]

# One version for the workspace: it is what CHANGELOG.md and the tags follow.
[workspace.package]
version = "0.52.9"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/tsumugi"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = false
